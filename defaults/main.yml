---
# By default no additional repository is added to the hosts to install dnsdist
dnsdist_install_repo: ""

# To install the latest build from the master branch of dnsdist from the
# PowerDNS official repository use the following playbook
# - hosts: all
#   roles:
#    - { role: PowerDNS.dnsdist,
#        dnsdist_install_repo: "{{ dnsdist_powerdns_repo_master }}"
#
# To install the 1.9.x release of the powerdns official repository
# use the following playbook
# - hosts: all
#   roles:
#    - { role: powerdns.dnsdist,
#        dnsdist_install_repo: "{{ dnsdist_powerdns_repo_19 }}"
#
# To install the 2.0.x release of the powerdns official repository
# use the following playbook
# - hosts: all
#   roles:
#    - { role: powerdns.dnsdist,
#        dnsdist_install_repo: "{{ dnsdist_powerdns_repo_20 }}"
#
# To install the 2.1.x release of the powerdns official repository
# use the following playbook
# - hosts: all
#   roles:
#    - { role: powerdns.dnsdist,
#        dnsdist_install_repo: "{{ dnsdist_powerdns_repo_21 }}"
#
# To install dnsdist from a custom repository
# override the `dnsdist_install_repo` default value in your playbook.
# e.g.
# - hosts: all
#   vars:
#     dnsdist_install_repo:
#       apt_repo_origin: "my.repo.com"  # used to pin the dnsdist packages to the provided repository origin
#       apt_version: "dnsdist-19"       # deb822 suites suffix (appended to release codename)
#       gpg_key_url: "http://my.repo.com/MYREPOGPGPUBKEY.asc" # repository public GPG key
#       yum_repo_baseurl: "http://my.repo.com/centos/$basearch/$releasever/dnsdist"
#       yum_debug_symbols_repo_baseurl: "http://my.repo.com/centos/$basearch/$releasever/dnsdist/debug"
#       name: "powerdns"       # the name of the repository
#   roles:
#    - { role: PowerDNS.dnsdist }

# Install the EPEL repository.
# EPEL is needed to satisfy some dnsdist dependencies like libsodium
dnsdist_install_epel: true

# The name of the dnsdist package
dnsdist_package_name: "{{ default_dnsdist_package_name }}"

# Install a specific version of dnsdist
# NB: The usage of this variable makes only sense on RedHat-like systems,
#     where each YUM repository can contains multiple versions of the same package.
dnsdist_package_version: ""

# The desired state of the dnsdist packages.
# Use "present" (default) to install, "latest" to upgrade, or "absent" to uninstall.
dnsdist_package_state: "present"

# Install dnsdist debug symbols package
dnsdist_install_debug_symbols_package: false

# The name of the dnsdist debug symbols package
dnsdist_debug_symbols_package_name: "{{ default_dnsdist_debug_symbols_package_name }}"

# Install additional packages
dnsdist_additional_packages: []
# dnsdist_additional_packages:
#   - name: extra-package
#     version: 1.0.0
#   - name: extra-package2
#   - extra-package3

# dnsdist listen addresses
dnsdist_locals: ["127.0.0.1:5300"]
# dnsdist backend servers
dnsdist_servers: []
# Access Control List
dnsdist_acls: []
# dnsdist's control socket encryption key.
# See https://dnsdist.org/reference/config.html#setKey for more information.
# If empty, a random key will be generated. If a key is already present in the
# configuration file, it will be kept.
dnsdist_setkey: ""

# Whether to auto-generate a control socket encryption key when dnsdist_setkey is empty.
dnsdist_generatekey: "{{ (dnsdist_setkey | length == 0) | bool }}"

# dnsdist's control socket list address.
dnsdist_controlsocket: 127.0.0.1

# Embedded webserver listen address.
dnsdist_webserver_address: ""

# Embedded webserver authentication password.
dnsdist_webserver_password: ""

# Embedded webserver authentication API-key.
dnsdist_webserver_apikey: ""

# Since 1.5.0, only connections from 127.0.0.1 and ::1 are allowed by default.
dnsdist_webserver_acl: ""

# Remote Carbon server for metrics exporting.
# See https://dnsdist.org/guides/carbon.html for more details.
dnsdist_carbonserver: ""

# Additional dnsdist configuration to be
# injected into dnsdist's configuration file.
dnsdist_config: ""

# Additional dnsdist configuration files.
dnsdist_config_files: {}
# dnsdist_config_files:
#   extra.conf: |
#     -- extra file with configration

# Format of the generated configuration file: "lua" (default) or "yaml".
#
# dnsdist picks the parser from the file name extension, so "yaml" also moves the
# configuration file from dnsdist.conf to dnsdist.yml.
#
# Whether the daemon then finds that file on its own depends on the release.
# dnsdist 2.1 and newer, given both files, read the .yml, so the packaged
# dnsdist.service - which passes no --config - needs no override to switch a
# single instance over. dnsdist 2.0 does not: it reads dnsdist.conf and never
# looks at the .yml, so a 2.0 host in this format runs the packaged Lua
# configuration and silently ignores what this role wrote. It needs an ExecStart
# and ExecStartPre override naming the file with --config, exactly like the
# templated unit below - see the README.
#
# The templated unit needs those overrides on every release: its ExecStart names
# dnsdist-<instance>.conf outright, and an explicit path has no .yml fallback.
#
# The two formats are separate inputs, and nothing is translated between them.
# In "lua" the configuration comes from dnsdist_locals, dnsdist_servers,
# dnsdist_acls, dnsdist_setkey, dnsdist_controlsocket, dnsdist_webserver_*,
# dnsdist_carbonserver, dnsdist_tlslocals and dnsdist_config; in "yaml" it comes
# from dnsdist_config_yaml alone and those variables are ignored.
dnsdist_config_format: lua

# Whether a "lua" run removes the YAML configuration file a previous "yaml" run
# of this role wrote.
#
# On dnsdist 2.1 and newer a daemon started without an explicit --config prefers
# the .yml over the .conf, so without this a switch back to Lua would leave the
# old YAML file in charge and the Lua configuration ignored. Only the .yml is ever
# removed, and only while the format is "lua": dnsdist.yml is not a packaged file
# - the packages ship dnsdist.yml-dist - whereas dnsdist.conf is, and in YAML mode
# on those releases it can stay where it is because the .yml already takes
# precedence.
#
# On dnsdist 2.0 the .conf is read either way, so the removal changes nothing
# there. It is not conditional on the release: a leftover .yml that stops being
# read the day the host is upgraded to 2.1 is worse than removing a file the
# daemon currently ignores.
dnsdist_config_remove_stale_yaml: true

# Location of the dnsdist configuration file. Instances of the templated
# systemd unit read /etc/dnsdist/dnsdist-<instance>.conf.
dnsdist_config_location: >-
  {{ (dnsdist_config_format == 'yaml')
     | ternary(default_dnsdist_config_location_yaml, default_dnsdist_config_location) }}

# The dnsdist configuration, in YAML format. Used only when
# dnsdist_config_format is "yaml".
#
# The dict is passed to dnsdist as given, so every setting of the YAML
# configuration is reachable without the role knowing about it. See
# https://dnsdist.org/reference/yaml-settings.html, and the dnsdist.yml-dist
# file the packages ship for the settings of the installed version.
dnsdist_config_yaml: {}
# dnsdist_config_yaml:
#   binds:
#     - listen_address: "127.0.0.1:5300"
#       protocol: Do53
#   backends:
#     - address: "127.0.0.1:53"
#       protocol: Do53
#   acl:
#     - 127.0.0.0/8
#   console:
#     listen_address: "127.0.0.1:5900"
#     key: "a base64 encoded key"

# Settings whose value must stay a string, however it is spelled.
#
# The renderer converts a value that *looks* like a number or a boolean into one,
# because dnsdist's YAML parser is strictly typed and rejects a quoted number
# where it wants a real one. It cannot know the declared type, though, so a
# password of "12345678" or a backend named "no" would be rewritten to an integer
# and to false. Any setting listed here is emitted as a string untouched, and the
# rule reaches nested values too, so an entry under `pools` stays a string.
#
# Matching is by key name at any depth, not by path, which is what makes it short.
dnsdist_config_yaml_string_keys:
  - api_key
  - key
  - name
  - password
  - pool
  - pools
  - secret

# Owner and group for the dnsdist configuration file
dnsdist_config_owner: "{{ default_dnsdist_owner }}"
dnsdist_config_group: "{{ default_dnsdist_group }}"

# Dict with overrides for the service (systemd only)
dnsdist_service_overrides: {}
# dnsdist_service_overrides:
#   LimitNOFILE: 10000

dnsdist_unit_overrides: {}
# dnsdist_service_overrides:
#  PartOf: "network.service"

dnsdist_environment_overrides: {}
# dnsdist_service_overrides:
#   PATH: "/var/lib/mylib/bin:$PATH"

# Name of the dnsdist service. Set it to 'dnsdist@<instance>' to manage an
# instance of the templated systemd unit shipped by the dnsdist packages.
dnsdist_service_name: dnsdist

# State of the DNSdist service
dnsdist_service_state: started
dnsdist_service_enabled: true
# Masking is a systemd concept and is ignored on hosts without systemd.
dnsdist_service_masked: false

# When true, disable the automated restart of the dnsdist service
dnsdist_disable_handlers: false

# When true, run the notified handlers at the end of the role instead of at the
# end of the play. Set this when the role runs more than once in a play.
dnsdist_flush_handlers: false

# When set, adds a DNS over TLS frontend
dnsdist_tlslocals: []

# When set to true, remove dnsdist packages and force a reinstall
# Not recommended for regular usage; Primarily intended for 2 scenario's:
# - Force a downgrade
# - Automation of test scenario's where switching between versions on the same server is necessary
dnsdist_force_reinstall: false

# Name of installable repo
dnsdist_install_repo_name: powerdns-dnsdist

# Regex for matching and removing non-version suffixed repos
dnsdist_install_repo_regex: "{{ '^' + dnsdist_install_repo_name + '\\.(list|sources|repo|asc)$' }}"

# Regex for matching and removing version suffixed repos
dnsdist_remove_versioned_repo_regex: '^powerdns-dnsdist-(master|\d+)\.(list|sources|repo|asc)$'

# When set to true remove version suffixed repos, set to false to keep using version suffixed repos
dnsdist_remove_versioned_repo_files: true
