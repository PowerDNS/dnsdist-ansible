---

##
# Install dnsdist from a PowerDNS repository and configure it.
#
# The release under test comes from the DNSDIST_VERSION environment variable and
# the platforms from the platform set given with --base-config, for example:
#
#   DNSDIST_VERSION=21 molecule \
#     -c molecule/config.yml \
#     -c molecule/platforms/dnsdist-21.yml \
#     test -s default
##

scenario:
  name: default

provisioner:
  playbooks:
    # Also named here so a bare `molecule` invocation, which does not load
    # molecule/config.yml, still reaches the platform guard in create.yml
    # instead of skipping every action as a missing playbook.
    create: ../resources/create.yml

verifier:
  directory: ../resources/tests/all
  additional_files_or_dirs:
    # path relative to 'directory'
    - ../repo/
