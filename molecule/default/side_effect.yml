---

##
# Handler and daemon reload behaviour of a single unit.
#
# Every step re-runs the role with `dnsdist_flush_handlers: true`, so the
# notified handlers run before the assertions instead of at the end of the play,
# and the last step restores the state the converge left, because the verifier
# runs after this playbook.
##

- name: Handler and daemon reload behaviour
  hosts: all
  vars_files:
    - ../resources/vars/dnsdist-version.yml
    - ../resources/vars/dnsdist-common.yml
  vars:
    _unit: dnsdist
    _dropin_dir: /etc/systemd/system/dnsdist.service.d
  tasks:

    - name: Skip the whole playbook on hosts without systemd
      ansible.builtin.meta: end_host
      when: ansible_facts.service_mgr != 'systemd'

    # The drop-ins the converge wrote, as the baseline every step builds on.
    - name: Record the configured overrides
      ansible.builtin.set_fact:
        _base_service_overrides: "{{ dnsdist_service_overrides }}"

    ##
    # A run that writes a drop-in has to tell systemd about it, even when no
    # handler restarts anything: the handlers flush at the end of the play, so
    # until then systemd would hand out the unit it loaded before the run, and a
    # service started in between - by the service task of a later role, or by an
    # operator - would come up with the settings of the stale unit.
    #
    # `NeedDaemonReload` is what systemd answers with while its copy of the unit
    # is older than the files on disk. Handlers are disabled here, so only the
    # reload of the service task itself can clear it. The running process keeps
    # its old limits until something restarts it, which is what the reload in
    # the restart handler is for.
    ##
    - name: Change a drop-in with the handlers disabled
      ansible.builtin.include_role:
        name: powerdns.dnsdist
      vars:
        dnsdist_disable_handlers: true
        dnsdist_flush_handlers: true
        dnsdist_service_overrides: "{{ _base_service_overrides | combine({'LimitNOFILE': 12345}) }}"

    - name: Read the unit after the drop-in changed
      ansible.builtin.systemd_service:
        name: "{{ _unit }}"
      register: _unit_after_start
      changed_when: false

    - name: Assert that systemd was told about the drop-in of this run
      ansible.builtin.assert:
        that:
          - _unit_after_start.status.NeedDaemonReload == 'no'
          - _unit_after_start.status.LimitNOFILE | int == 12345
          - _unit_after_start.status.ActiveState == 'active'
        fail_msg: >-
          systemd still holds the unit it loaded before this run:
          NeedDaemonReload={{ _unit_after_start.status.NeedDaemonReload }},
          LimitNOFILE={{ _unit_after_start.status.LimitNOFILE }},
          ActiveState={{ _unit_after_start.status.ActiveState }}

    ##
    # A drop-in changed while the service is deliberately stopped still has to
    # reach systemd: the restart handler omits the restart and keeps the reload.
    ##
    - name: Change a drop-in while the service is stopped
      ansible.builtin.include_role:
        name: powerdns.dnsdist
      vars:
        dnsdist_flush_handlers: true
        dnsdist_service_state: stopped
        dnsdist_service_overrides: "{{ _base_service_overrides | combine({'LimitNOFILE': 4242}) }}"

    - name: Read the unit of the stopped service
      ansible.builtin.systemd_service:
        name: "{{ _unit }}"
      register: _unit_stopped
      changed_when: false

    - name: Assert that the stopped unit was reloaded but not started
      ansible.builtin.assert:
        that:
          - _unit_stopped.status.LimitNOFILE | int == 4242
          - _unit_stopped.status.ActiveState == 'inactive'
        fail_msg: >-
          LimitNOFILE={{ _unit_stopped.status.LimitNOFILE }},
          ActiveState={{ _unit_stopped.status.ActiveState }}

    ##
    # Emptying an override dict removes the drop-in of that dict alone: the
    # other drop-ins of the role and any drop-in the operator added themselves
    # stay, and the service restarts on the unit without the removed settings.
    ##
    - name: Add a drop-in of the operator next to the ones of the role
      ansible.builtin.copy:
        content: |
          [Service]
          LimitMSGQUEUE=1234567
        dest: "{{ _dropin_dir }}/10-operator.conf"
        owner: root
        group: root
        mode: '0644'

    - name: Read the unit before the overrides are emptied
      ansible.builtin.systemd_service:
        name: "{{ _unit }}"
      register: _unit_before_removal
      changed_when: false

    - name: Empty every override dict
      ansible.builtin.include_role:
        name: powerdns.dnsdist
      vars:
        dnsdist_flush_handlers: true
        dnsdist_service_overrides: {}
        dnsdist_unit_overrides: {}
        dnsdist_environment_overrides: {}

    - name: Stat the drop-ins after the overrides were emptied
      ansible.builtin.stat:
        path: "{{ _dropin_dir }}/{{ item }}"
      loop:
        - override.conf
        - override-unit.conf
        - override-environment.conf
        - 10-operator.conf
      register: _dropins_after_removal

    - name: Read the unit after the overrides were emptied
      ansible.builtin.systemd_service:
        name: "{{ _unit }}"
      register: _unit_after_removal
      changed_when: false

    - name: Assert that only the drop-ins of the role were removed
      ansible.builtin.assert:
        that:
          - not _stats['override.conf']
          - not _stats['override-unit.conf']
          - not _stats['override-environment.conf']
          - _stats['10-operator.conf']
        fail_msg: "drop-ins found on the host: {{ _stats }}"
      vars:
        _stats: >-
          {{ dict(_dropins_after_removal.results
                  | map(attribute='item')
                  | zip(_dropins_after_removal.results | map(attribute='stat.exists'))) }}

    - name: Assert that the removal reloaded the unit and restarted the service
      ansible.builtin.assert:
        that:
          - _unit_after_removal.status.LimitNOFILE | int != 4242
          - _unit_after_removal.status.PartOf | default('') == ''
          - _unit_after_removal.status.LimitMSGQUEUE | int == 1234567
          - >-
            _unit_after_removal.status.ActiveEnterTimestampMonotonic | int
            > _unit_before_removal.status.ActiveEnterTimestampMonotonic | int
        fail_msg: >-
          before={{ _unit_before_removal.status.ActiveEnterTimestampMonotonic }},
          after={{ _unit_after_removal.status.ActiveEnterTimestampMonotonic }},
          LimitNOFILE={{ _unit_after_removal.status.LimitNOFILE }},
          PartOf={{ _unit_after_removal.status.PartOf | default('') }}

    ##
    # The YAML configuration format.
    #
    # Only dnsdist 2.1 and newer look for dnsdist.yml on their own. Given both
    # files a 2.1 reads the .yml; a 2.0 reads /etc/dnsdist/dnsdist.conf and never
    # looks at the .yml unless --config names it. What this block asserts - that
    # the daemon ends up running on the configuration the role wrote, with no
    # unit override - therefore only holds on the releases that auto-detect the
    # file, so the older ones are left out. YAML on 2.0 works with an ExecStart
    # and ExecStartPre override and is documented in the README instead.
    #
    # Along with the format, the two things the renderer has to get right: a
    # value that looks like a number or a boolean becomes one, because the parser
    # is strictly typed, while a value whose key is in
    # dnsdist_config_yaml_string_keys stays a string however it looks.
    ##
    - name: Exercise the YAML configuration format
      # The releases the PowerDNS repositories name, minus the two that do not
      # auto-detect the file. Naming the exclusions keeps "master" included.
      when: dnsdist_test_version not in ['19', '20']
      block:
        - name: Configure dnsdist in the YAML format
          ansible.builtin.include_role:
            name: powerdns.dnsdist
          vars:
            dnsdist_flush_handlers: true
            dnsdist_config_format: yaml
            dnsdist_config_yaml:
              binds:
                - listen_address: "127.0.0.1:5300"
                  protocol: Do53
                  # Strings on purpose: an inventory value arrives as one.
                  threads: "2"
                  reuseport: "yes"
              backends:
                - address: "127.0.0.1:5300"
                  protocol: Do53
                  # Must survive as strings, not become false and 1.
                  name: "no"
                  pools: ["1"]
                  weight: "10"
              acl: "['127.0.0.0/8']"
              webserver:
                listen_addresses:
                  - "127.0.0.1:8083"
                password: "12345678"

        - name: Read the rendered YAML configuration
          ansible.builtin.slurp:
            src: /etc/dnsdist/dnsdist.yml
          register: _dnsdist_yaml_rendered

        - name: Assert that the YAML configuration carries the right types
          ansible.builtin.assert:
            that:
              # Converted, because the parser wants real types here.
              - _rendered.binds[0].threads == 2
              - _rendered.binds[0].reuseport is sameas true
              - _rendered.backends[0].weight == 10
              # A stringified list becomes a real one.
              - _rendered.acl == ['127.0.0.0/8']
              # Left alone, because their keys are string keys.
              - _rendered.backends[0].name == 'no'
              - _rendered.backends[0].pools == ['1']
              - _rendered.webserver.password == '12345678'
            fail_msg: "{{ _rendered | to_json }}"
          vars:
            _rendered: "{{ _dnsdist_yaml_rendered.content | b64decode | from_yaml }}"

        - name: Ask dnsdist which configuration file it reads
          ansible.builtin.command: dnsdist --check-config
          register: _dnsdist_yaml_check
          changed_when: false

        - name: Assert that dnsdist reads the YAML file and accepts it
          ansible.builtin.assert:
            that:
              - "'/etc/dnsdist/dnsdist.yml' in _dnsdist_yaml_check.stdout"
              - "'Configuration OK' in _dnsdist_yaml_check.stdout"
            fail_msg: "{{ _dnsdist_yaml_check.stdout }}"

        - name: Read the dnsdist unit in the YAML format
          ansible.builtin.systemd_service:
            name: "{{ _unit }}"
          register: _dnsdist_yaml_unit
          changed_when: false

        - name: Assert that dnsdist is running on the YAML configuration
          ansible.builtin.assert:
            that:
              - _dnsdist_yaml_unit.status.ActiveState == 'active'
            fail_msg: "ActiveState={{ _dnsdist_yaml_unit.status.ActiveState }}"

        ##
        # Back to Lua. The YAML file has to go with it: on the releases this block
        # runs on, a dnsdist started without an explicit --config prefers the .yml
        # over the .conf, so a leftover would keep the Lua configuration ignored.
        ##
        - name: Configure dnsdist back in the Lua format
          ansible.builtin.include_role:
            name: powerdns.dnsdist
          vars:
            dnsdist_flush_handlers: true

        - name: Stat the YAML configuration after the switch back to Lua
          ansible.builtin.stat:
            path: /etc/dnsdist/dnsdist.yml
          register: _dnsdist_yaml_leftover

        - name: Ask dnsdist which configuration file it reads after the switch back
          ansible.builtin.command: dnsdist --check-config
          register: _dnsdist_lua_check
          changed_when: false

        - name: Assert that the YAML file is gone and Lua is back in charge
          ansible.builtin.assert:
            that:
              - not _dnsdist_yaml_leftover.stat.exists
              - "'/etc/dnsdist/dnsdist.conf' in _dnsdist_lua_check.stdout"
              - "'Configuration OK' in _dnsdist_lua_check.stdout"
            fail_msg: >-
              yml_present={{ _dnsdist_yaml_leftover.stat.exists }},
              check={{ _dnsdist_lua_check.stdout }}

    ##
    # Leave the host as the converge left it, for the verifier.
    ##
    - name: Remove the drop-in of the operator
      ansible.builtin.file:
        path: "{{ _dropin_dir }}/10-operator.conf"
        state: absent

    - name: Restore the configured overrides
      ansible.builtin.include_role:
        name: powerdns.dnsdist
      vars:
        dnsdist_flush_handlers: true
