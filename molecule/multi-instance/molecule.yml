---

scenario:
  name: multi-instance

driver:
  name: docker

dependency:
  name: galaxy

platforms:

  - name: rockylinux-9
    image: rockylinux:9
    dockerfile_tpl: el-systemd

provisioner:
  name: ansible
  options:
    diff: true
    v: true
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  inventory:
    links:
      host_vars: ../resources/host_vars/
  playbooks:
    create: ../resources/create.yml
    destroy: ../resources/destroy.yml
    prepare: ../resources/prepare.yml
    side_effect: side_effect.yml

verifier:
  name: testinfra
  options:
    vvv: true
  directory: ../resources/tests/multi-instance
