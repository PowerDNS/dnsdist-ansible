---

# Configure one dnsdist instance. `instance` is an entry of
# `dnsdist_multi_instances`; `instance_revision` changes the generated
# configuration so the restart handler is notified.
#
# The configuration path is the Debian and Enterprise Linux layout, which is what
# every platform set of this scenario uses. On Arch Linux the templated unit
# reads /etc/dnsdist-<instance>.conf instead.
- name: Configure the dnsdist instance {{ instance.name }}
  ansible.builtin.include_role:
    name: powerdns.dnsdist
  vars:
    dnsdist_service_name: "dnsdist@{{ instance.name }}"
    dnsdist_config_location: "/etc/dnsdist/dnsdist-{{ instance.name }}.conf"
    dnsdist_flush_handlers: true
    dnsdist_locals: ["{{ instance.local }}"]
    dnsdist_controlsocket: "{{ instance.controlsocket }}"
    dnsdist_servers: ["{{ instance.server }}"]
    dnsdist_config: "-- instance {{ instance.name }} revision {{ instance_revision | default(1) }}"
    dnsdist_service_overrides:
      LimitCORE: infinity
