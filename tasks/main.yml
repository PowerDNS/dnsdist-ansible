---

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"
  tags:
    - always

# Checked here rather than next to the configuration tasks because
# dnsdist_config_format decides dnsdist_config_location, the console key probe
# below and the template to render, so a bad value has to be caught before any of
# them - including under a narrow --tags run that never reaches configure.yml.
- name: Reject an unknown dnsdist configuration format
  ansible.builtin.fail:
    msg: >-
      dnsdist_config_format is "{{ dnsdist_config_format }}", which is neither
      "lua" nor "yaml".
  when: dnsdist_config_format not in ['lua', 'yaml']
  tags:
    - always

# dnsdist selects its parser from the file name extension, so the format and the
# path have to agree. They can disagree only when an operator sets
# dnsdist_config_location by hand - for an instance of the templated unit, say -
# and that mistake is otherwise silent in the worst way: the configuration check
# is run against a name this role chooses, so it passes, and the daemon then
# reads the deployed file under the other parser and fails at start.
- name: Reject a dnsdist configuration format that the file name contradicts
  ansible.builtin.fail:
    msg: >-
      dnsdist_config_format is "{{ dnsdist_config_format }}" but
      dnsdist_config_location is "{{ dnsdist_config_location }}". dnsdist picks
      its parser from the extension, so a YAML configuration needs a .yml or
      .yaml name and a Lua one needs any other.
  when: (dnsdist_config_format == 'yaml') != (dnsdist_config_location is match('.*\.ya?ml$'))
  tags:
    - always

- name: Render the merged dnsdist YAML configuration
  ansible.builtin.set_fact:
    _dnsdist_config_yaml_merged: >-
      {{ default_dnsdist_config_yaml
         | ansible.builtin.combine(dnsdist_config_yaml, recursive=true) }}
  when: dnsdist_config_format == 'yaml'
  tags:
    - always

# Handlers cannot read role parameters reliably when the role runs more than
# once in a play; they resolve to the last invocation. Publish them as facts.
- name: Publish the handler context of this role invocation
  ansible.builtin.set_fact:
    _dnsdist_disable_handlers: "{{ dnsdist_disable_handlers }}"
    _dnsdist_service_name: "{{ dnsdist_service_name }}"
    _dnsdist_service_state: "{{ dnsdist_service_state }}"
  tags:
    - always

- name: Set fact for repo name
  when: "dnsdist_install_repo | length > 0"
  ansible.builtin.set_fact:
    dnsdist_repo_name: "{{ dnsdist_remove_versioned_repo_files | ternary(dnsdist_install_repo_name, dnsdist_install_repo['name']) }}"
    dnsdist_repo_regex: "{{ dnsdist_remove_versioned_repo_files | ternary(dnsdist_remove_versioned_repo_regex, dnsdist_install_repo_regex) }}"
  tags:
    - install
    - repository

- name: Setup repository
  ansible.builtin.include_tasks: "repo-{{ ansible_facts.os_family }}.yml"
  when: dnsdist_install_repo | length > 0
  tags:
    - install
    - repository

- name: Install dnsdist
  ansible.builtin.include_tasks: install.yml
  tags:
    - install

# The unit is gone by the time the handlers flush, so the reload happens here
# rather than through the restart handler, and it is not suppressed by
# dnsdist_disable_handlers: leaving systemd with drop-ins it still holds but that
# no longer exist is what this removes.
#
# The whole drop-in directory goes here, because the unit it belongs to is being
# removed. While the package stays installed only the file this role writes is
# removed, when its override dict is emptied - see tasks/configure.yml.
#
# Tagged `install`, because removal runs through the install path:
# `-e dnsdist_package_state=absent --tags install`, the only run that reaches
# this once the packages are gone. A full run still fails afterwards on the
# service task, as the README describes.
- name: Remove the systemd drop-in overrides on uninstall
  when:
    - dnsdist_package_state == 'absent'
    - ansible_facts.service_mgr == 'systemd'
  tags:
    - install
  block:
    - name: Remove the dnsdist drop-in override directory (systemd)
      ansible.builtin.file:
        path: /etc/systemd/system/{{ dnsdist_service_name }}.service.d
        state: absent
      register: _dnsdist_uninstall_dropin_dir

    - name: Reload systemd after removing the drop-in overrides  # noqa: no-handler
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _dnsdist_uninstall_dropin_dir is defined and _dnsdist_uninstall_dropin_dir.changed

# In YAML format the key is written to console.key, and the role only fills that
# in for a configuration that asks for a console - so with no `console` section
# there is nowhere to put a key. Generating one anyway would report `changed` on
# every converge for a key that is never written and never used.
- name: Create encryption key
  when:
    - dnsdist_generatekey | bool
    - >-
      dnsdist_config_format == 'lua'
      or (_dnsdist_config_yaml_merged | default({})).console is defined
  tags:
    - install
    - configure
    - config
  block:
    # The key the previous run wrote has to be recovered from the configuration
    # file, or every converge would hand the console a new one. Where it sits
    # depends on the format: the Lua configuration carries a setKey("...") call,
    # the YAML one a console.key setting.
    - name: Check if the key is already present in the DNSdist configuration file
      ansible.builtin.shell: |
        set -o pipefail && grep '^\s*setKey' "{{ dnsdist_config_location }}" | sed 's/.*setKey("\(.*\)").*/\1/'
      args:
        executable: /bin/bash
      register: _dnsdist_grepkey
      when: dnsdist_config_format == 'lua'
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read the console key from the YAML configuration
      when: dnsdist_config_format == 'yaml'
      block:
        - name: Check whether the dnsdist YAML configuration file exists
          ansible.builtin.stat:
            path: "{{ dnsdist_config_location }}"
          register: _dnsdist_config_file
          check_mode: false

        - name: Read the dnsdist YAML configuration
          ansible.builtin.slurp:
            src: "{{ dnsdist_config_location }}"
          register: _dnsdist_config_current
          when: _dnsdist_config_file.stat.exists
          check_mode: false

    # `is mapping` rather than `default({}, true)`: an empty file parses as None,
    # which default() with the second argument does replace, but a file whose top
    # level is a scalar or a list parses as a truthy non-mapping that it does not
    # - and .get() on a str raises. That is what a Lua configuration sitting at a
    # .yml path parses as.
    - name: Collect the console key the configuration file already carries
      ansible.builtin.set_fact:
        _dnsdist_existing_key: >-
          {{ (_dnsdist_grepkey.stdout | default('') | trim)
             if dnsdist_config_format == 'lua'
             else (_parsed.console.key | default(''))
                  if (_parsed is mapping and _parsed.console is mapping)
                  else '' }}
      vars:
        _parsed: >-
          {{ _dnsdist_config_current.content | default('') | b64decode | from_yaml }}

    - name: Set up new encryption key
      # if the config file does not contains a key already
      when: _dnsdist_existing_key | length == 0
      block:
        - name: Generate encryption key  # noqa no-changed-when
          ansible.builtin.shell: head -c 32 /dev/urandom | base64
          args:
            executable: /bin/bash
          register: _dnsdist_setkey_generate
          changed_when: true

        - name: Base64 encode encyption key
          ansible.builtin.set_fact:
            dnsdist_setkey: "{{ _dnsdist_setkey_generate.stdout }}"

    - name: Set old encryption key
      ansible.builtin.set_fact:
        dnsdist_setkey: "{{ _dnsdist_existing_key }}"
      when: _dnsdist_existing_key | length > 0

- name: Build config file
  ansible.builtin.include_tasks: configure.yml
  tags:
    - configure
    - config

# The handlers flush at the end of the play, so systemd still holds the unit it
# loaded before this run when this task starts a service that is not running
# yet: reload first when this run changed a drop-in. An already running service
# is untouched by the reload, which is what the restart handler is for.
- name: Set the status of the dnsdist service (systemd)
  ansible.builtin.systemd_service:
    name: "{{ dnsdist_service_name }}"
    state: "{{ dnsdist_service_state }}"
    enabled: "{{ dnsdist_service_enabled }}"
    masked: "{{ dnsdist_service_masked }}"
    daemon_reload: >-
      {{ (_dnsdist_service_override is defined and _dnsdist_service_override.changed)
         or (_dnsdist_service_override_removed is defined and _dnsdist_service_override_removed.changed)
         or (_dnsdist_unit_override is defined and _dnsdist_unit_override.changed)
         or (_dnsdist_unit_override_removed is defined and _dnsdist_unit_override_removed.changed)
         or (_dnsdist_environment_override is defined and _dnsdist_environment_override.changed)
         or (_dnsdist_environment_override_removed is defined and _dnsdist_environment_override_removed.changed) }}
  when: ansible_facts.service_mgr == 'systemd'
  tags:
    - service

# FreeBSD has no systemd, so the generic module drives its rc.d scripts.
- name: Set the status of the dnsdist service
  ansible.builtin.service:
    name: "{{ dnsdist_service_name }}"
    state: "{{ dnsdist_service_state }}"
    enabled: "{{ dnsdist_service_enabled }}"
  when: ansible_facts.service_mgr != 'systemd'
  tags:
    - service

- name: Flush the handlers
  ansible.builtin.meta: flush_handlers
  when: dnsdist_flush_handlers | bool
  tags:
    - always
